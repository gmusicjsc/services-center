<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.Music - Quản Lý Bảo Hành</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fdf4f8', 100: '#fbe8f2', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome cho icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-600 text-white p-2 rounded-lg font-bold text-xl flex items-center justify-center w-10 h-10 shadow-inner">
                    G
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">G.MUSIC WARRANTY</h1>
                    <p class="text-xs text-slate-400">Hệ thống quản lý bảo hành thiết bị âm thanh</p>
                </div>
            </div>

            <!-- Nút điều hướng & Thao tác Cloud -->
            <div class="flex items-center space-x-2 flex-wrap gap-y-2">
                <button onclick="openModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Tạo Phiếu BH</span>
                </button>
                <button onclick="manualSyncToCloud()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-sm font-medium transition shadow flex items-center space-x-1" title="Lưu lên Google Sheet">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span class="hidden sm:inline">Lưu Sheet</span>
                </button>
                <button onclick="loadFromCloud()" class="bg-sky-600 hover:bg-sky-700 text-white px-3 py-2 rounded-lg text-sm font-medium transition shadow flex items-center space-x-1" title="Tải từ Google Sheet">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                    <span class="hidden sm:inline">Tải Sheet</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- Thanh Tìm kiếm và Bộ lọc -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="w-full md:w-96 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" oninput="renderTable()" placeholder="Tìm kiếm theo mã phiếu, serial, khách hàng..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            
            <div class="flex items-center space-x-3 w-full md:w-auto justify-end">
                <span class="text-sm text-slate-500 font-medium">Tổng số: <strong id="totalCount" class="text-slate-800">0</strong> phiếu</span>
            </div>
        </div>

        <!-- Bảng Dữ Liệu -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="p-3 font-semibold">STT</th>
                            <th class="p-3 font-semibold">Số Phiếu BH</th>
                            <th class="p-3 font-semibold">Số Serial</th>
                            <th class="p-3 font-semibold">Khách Hàng</th>
                            <th class="p-3 font-semibold">Tên Hàng Hóa</th>
                            <th class="p-3 font-semibold">Thương Hiệu</th>
                            <th class="p-3 font-semibold">Ngày Nhận</th>
                            <th class="p-3 font-semibold">Tình Trạng</th>
                            <th class="p-3 font-semibold text-center">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="warrantyTableBody" class="divide-y divide-slate-200 text-sm">
                        <!-- Dữ liệu được render bằng JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Form Tạo/Sửa Phiếu -->
    <div id="warrantyModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-xl max-w-3xl w-full overflow-hidden my-8">
            <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-lg">Tạo Phiếu Bảo Hành Mới</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="warrantyForm" onsubmit="saveWarranty(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <input type="hidden" id="editIndex">
                <input type="hidden" id="itemId">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Số Phiếu BH</label>
                        <input type="text" id="ticketNumber" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Số Serial</label>
                        <input type="text" id="serialNumber" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tên Khách Hàng</label>
                        <input type="text" id="customerName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tên Hàng Hóa</label>
                        <input type="text" id="itemName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Thương Hiệu</label>
                        <input type="text" id="brand" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ngày Nhận Thiết Bị</label>
                        <input type="date" id="dateReceived" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ngày Trả Thiết Bị</label>
                        <input type="date" id="dateReturned" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ngày Mua Hàng</label>
                        <input type="date" id="purchaseDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tình Trạng</label>
                        <select id="status" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            <option value="Mới tiếp nhận">Mới tiếp nhận</option>
                            <option value="Đang sửa chữa">Đang sửa chữa</option>
                            <option value="Đã hoàn thành">Đã hoàn thành</option>
                            <option value="Đã trả khách">Đã trả khách</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mô Tả Lỗi</label>
                        <textarea id="errorDesc" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nội Dung Xử Lý</label>
                        <textarea id="repairProcess" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none"></textarea>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-200">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium rounded-lg transition">Hủy</button>
                    <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg transition shadow">Lưu Lại</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-2 rounded-lg shadow-lg text-sm hidden transition-all duration-300 z-50">
        Thông báo hệ thống
    </div>

    <!-- JavaScript Logic -->
    <script>
        // URL Google Apps Script của anh
        const googleScriptUrl = "https://script.google.com/macros/s/AKfycbzQ7N7Xk5y9S-_J3g4_fG2hH6jK8L1mN3pQ5rT7vW9xY2z/exec"; // Thay đúng URL Web App của anh nếu cần

        let warrantyList = [];

        // Khởi chạy khi tải trang
        window.onload = function() {
            const localData = localStorage.getItem('gmusic_warranty_list');
            if (localData) {
                warrantyList = JSON.parse(localData);
                renderTable();
            } else {
                loadFromCloud();
            }
        };

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `fixed bottom-5 right-5 px-4 py-2 rounded-lg shadow-lg text-sm z-50 transition-all duration-300 ${isError ? 'bg-red-600 text-white' : 'bg-slate-900 text-white'}`;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // Hàm chuẩn hóa ngày tháng sang DD/MM/YYYY để lưu trữ và hiển thị chuẩn xác
        function parseDateToDisplay(dateStr) {
            if (!dateStr || dateStr === "—" || dateStr === "") return "—";
            // Nếu đã đúng định dạng DD/MM/YYYY
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateStr)) return dateStr;
            // Nếu là định dạng YYYY-MM-DD từ input date
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                const parts = dateStr.split('-');
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            let d = new Date(dateStr);
            if (!isNaN(d.getTime())) {
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = d.getFullYear();
                return `${day}/${month}/${year}`;
            }
            return dateStr;
        }

        function parseDateToInput(dateStr) {
            if (!dateStr || dateStr === "—" || dateStr === "") return "";
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateStr)) {
                const parts = dateStr.split('/');
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            return "";
        }

        function renderTable() {
            const tbody = document.getElementById('warrantyTableBody');
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            tbody.innerHTML = '';

            const filteredList = warrantyList.filter(item => {
                return (
                    (item.ticketNumber && item.ticketNumber.toLowerCase().includes(keyword)) ||
                    (item.serialNumber && item.serialNumber.toLowerCase().includes(keyword)) ||
                    (item.customerName && item.customerName.toLowerCase().includes(keyword)) ||
                    (item.itemName && item.itemName.toLowerCase().includes(keyword))
                );
            });

            document.getElementById('totalCount').innerText = filteredList.length;

            if (filteredList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center py-6 text-slate-400">Không tìm thấy dữ liệu phù hợp</td></tr>`;
                return;
            }

            filteredList.forEach((item, index) => {
                const originalIndex = warrantyList.indexOf(item);
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 border-b border-slate-100 transition";
                tr.innerHTML = `
                    <td class="p-3 text-slate-500 text-xs">${index + 1}</td>
                    <td class="p-3 font-medium text-slate-900">${item.ticketNumber || '—'}</td>
                    <td class="p-3 text-slate-600 font-mono text-xs">${item.serialNumber || '—'}</td>
                    <td class="p-3 font-medium text-slate-800">${item.customerName || '—'}</td>
                    <td class="p-3 text-slate-700">${item.itemName || '—'}</td>
                    <td class="p-3 text-slate-600">${item.brand || '—'}</td>
                    <td class="p-3 text-slate-600">${parseDateToDisplay(item.dateReceived)}</td>
                    <td class="p-3">
                        <span class="px-2.5 py-1 text-xs rounded-full font-medium 
                            ${item.status === 'Đã hoàn thành' ? 'bg-emerald-100 text-emerald-800' : 
                              item.status === 'Đang sửa chữa' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-800'}">
                            ${item.status || 'Mới tiếp nhận'}
                        </span>
                    </td>
                    <td class="p-3 text-center space-x-2">
                        <button onclick="editWarranty(${originalIndex})" class="text-sky-600 hover:text-sky-800 transition" title="Sửa"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteWarranty(${originalIndex})" class="text-red-600 hover:text-red-800 transition" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openModal() {
            document.getElementById('warrantyForm').reset();
            document.getElementById('editIndex').value = '';
            document.getElementById('itemId').value = Date.now().toString();
            document.getElementById('modalTitle').innerText = 'Tạo Phiếu Bảo Hành Mới';
            document.getElementById('warrantyModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('warrantyModal').classList.add('hidden');
        }

        function editWarranty(index) {
            const item = warrantyList[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('itemId').value = item.id || Date.now().toString();
            document.getElementById('ticketNumber').value = item.ticketNumber || '';
            document.getElementById('serialNumber').value = item.serialNumber || '';
            document.getElementById('customerName').value = item.customerName || '';
            document.getElementById('itemName').value = item.itemName || '';
            document.getElementById('brand').value = item.brand || '';
            document.getElementById('dateReceived').value = parseDateToInput(item.dateReceived);
            document.getElementById('dateReturned').value = parseDateToInput(item.dateReturned);
            document.getElementById('purchaseDate').value = parseDateToInput(item.purchaseDate);
            document.getElementById('status').value = item.status || 'Mới tiếp nhận';
            document.getElementById('errorDesc').value = item.errorDesc || '';
            document.getElementById('repairProcess').value = item.repairProcess || '';

            document.getElementById('modalTitle').innerText = 'Chỉnh Sửa Phiếu Bảo Hành';
            document.getElementById('warrantyModal').classList.remove('hidden');
        }

        function saveWarranty(event) {
            event.preventDefault();
            const editIndex = document.getElementById('editIndex').value;

            const itemData = {
                id: document.getElementById('itemId').value,
                ticketNumber: document.getElementById('ticketNumber').value,
                serialNumber: document.getElementById('serialNumber').value,
                customerName: document.getElementById('customerName').value,
                itemName: document.getElementById('itemName').value,
                brand: document.getElementById('brand').value,
                dateReceived: parseDateToDisplay(document.getElementById('dateReceived').value),
                dateReturned: parseDateToDisplay(document.getElementById('dateReturned').value),
                purchaseDate: parseDateToDisplay(document.getElementById('purchaseDate').value),
                status: document.getElementById('status').value,
                errorDesc: document.getElementById('errorDesc').value,
                repairProcess: document.getElementById('repairProcess').value
            };

            if (editIndex === '') {
                warrantyList.unshift(itemData);
            } else {
                warrantyList[editIndex] = itemData;
            }

            localStorage.setItem('gmusic_warranty_list', JSON.stringify(warrantyList));
            closeModal();
            renderTable();
            showToast('Đã lưu dữ liệu cục bộ thành công!');
        }

        function deleteWarranty(index) {
            if (confirm('Bạn có chắc chắn muốn xóa phiếu bảo hành này không?')) {
                warrantyList.splice(index, 1);
                localStorage.setItem('gmusic_warranty_list', JSON.stringify(warrantyList));
                renderTable();
                showToast('Đã xóa phiếu!');
            }
        }

        // TẢI DỮ LIỆU TỪ GOOGLE SHEET
        async function loadFromCloud() {
            showToast('Đang tải dữ liệu từ Google Sheet...');
            try {
                const response = await fetch(googleScriptUrl);
                const data = await response.json();
                if (Array.isArray(data)) {
                    warrantyList = data.map(i => ({
                        id: i['id'] || '',
                        ticketNumber: i['Số phiếu BH'] || '',
                        serialNumber: i['Số serial'] || '',
                        customerName: i['Tên khách hàng'] || '',
                        itemName: i['Tên hàng hóa'] || '',
                        brand: i['Thương hiệu'] || '',
                        dateReceived: parseDateToDisplay(i['Ngày nhận thiết bị']),
                        dateReturned: parseDateToDisplay(i['Ngày trả thiết bị']),
                        purchaseDate: parseDateToDisplay(i['Ngày mua hàng']),
                        status: i['Tình trạng'] || 'Mới tiếp nhận',
                        errorDesc: i['Mô tả lỗi'] || '',
                        repairProcess: i['Nội dung xử lý'] || ''
                    }));
                    localStorage.setItem('gmusic_warranty_list', JSON.stringify(warrantyList));
                    renderTable();
                    showToast('Đã đồng bộ dữ liệu từ Google Sheet thành công!');
                }
            } catch (err) {
                console.error(err);
                showToast('Lỗi tải dữ liệu từ Google Sheet!', true);
            }
        }

        // LƯU LÊN GOOGLE SHEET - Chuẩn hóa truyền chuỗi text chống nhảy ngày
        async function manualSyncToCloud() {
            showToast('Đang lưu dữ liệu lên Google Sheet...');
            try {
                const payload = warrantyList.map(i => ({
                    "id": String(i.id || ''),
                    "Số phiếu BH": String(i.ticketNumber || ''),
                    "Số serial": String(i.serialNumber || ''),
                    "Tên khách hàng": String(i.customerName || ''),
                    "Tên hàng hóa": String(i.itemName || ''),
                    "Thương hiệu": String(i.brand || ''),
                    "Ngày nhận thiết bị": String(parseDateToDisplay(i.dateReceived) || ''),
                    "Ngày trả thiết bị": String(parseDateToDisplay(i.dateReturned) || ''),
                    "Ngày mua hàng": String(parseDateToDisplay(i.purchaseDate) || ''),
                    "Mô tả lỗi": String(i.errorDesc || ''),
                    "Nội dung xử lý": String(i.repairProcess || ''),
                    "Tình trạng": String(i.status || '')
                }));

                await fetch(googleScriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                showToast('Đã gửi yêu cầu lưu lên Google Sheet thành công!');
            } catch (err) {
                console.error(err);
                showToast('Lỗi lưu lên Google Sheet!', true);
            }
        }
    </script>
</body>
</html>
