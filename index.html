<!DOCTYPE html>
<html lang="vi">
<head>

    <title>Hệ Thống Quản Lý Bảo Hành & Sửa Chữa - G.Music</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo-G.Music-2026-vuong.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .custom-input {
            width: 100%;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .custom-input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.15);
        }
        .field-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 50;
            max-height: none;
            overflow-y: visible;
        }
        .dropdown-menu.show { display: block; }
        .sortable-th { cursor: pointer; user-select: none; transition: background 0.2s; }
        .sortable-th:hover { background-color: #f1f5f9; color: #7c3aed; }

        /* Tối ưu khi in / xuất PDF trang Báo cáo */
        @media print {
            body { background-color: white !important; }
            header, nav, button, input[type="month"], #search-input, select, .no-print { display: none !important; }
            section { display: none !important; }
            #tab-report { display: block !important; padding: 0 !important; margin: 0 !important; }
            .bg-white { border: 1px solid #e2e8f0 !important; box-shadow: none !important; break-inside: avoid; }
        }
    </style>
</head>
